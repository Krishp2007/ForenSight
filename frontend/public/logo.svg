<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 155" width="100%" height="100%">
  <defs>
    <!-- Neon Violet to Electric Indigo Gradient for NSIGHT -->
    <linearGradient id="violetIndigoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Underline Gradient -->
    <linearGradient id="violetLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stroke-opacity="0.9" />
      <stop offset="70%" stop-color="#6366F1" stroke-opacity="1" />
      <stop offset="100%" stop-color="#4F46E5" stroke-opacity="1" />
    </linearGradient>
  </defs>

  <g transform="translate(15, 12)">
    <!-- Wordmark Group -->
    <g transform="translate(0, 0)">
      <!-- F (White) -->
      <path d="M 10 10 H 42 V 22 H 24 V 38 H 38 V 50 H 24 V 80 H 10 V 10 Z" fill="#FFFFFF" />

      <!-- O (White) -->
      <path d="M 48 10 H 84 V 80 H 48 V 10 Z M 62 22 V 68 H 70 V 22 H 62 Z" fill="#FFFFFF" />

      <!-- R (White) -->
      <path d="M 90 10 H 126 V 46 H 114 L 128 80 H 112 L 100 48 H 104 V 80 H 90 V 10 Z M 104 22 V 36 H 112 V 22 H 104 Z" fill="#FFFFFF" />

      <!-- E (Stylized Triple Horizontal Bars in White) -->
      <rect x="132" y="10" width="30" height="11" fill="#FFFFFF" rx="2" />
      <rect x="132" y="34.5" width="25" height="11" fill="#FFFFFF" rx="2" />
      <rect x="132" y="59" width="30" height="11" fill="#FFFFFF" rx="2" />

      <!-- N (Violet to Indigo) -->
      <path d="M 172 10 H 184 L 206 55 V 10 H 218 V 80 H 206 L 184 35 V 80 H 172 V 10 Z" fill="url(#violetIndigoGrad)" />

      <!-- S (Violet to Indigo) -->
      <path d="M 224 10 H 260 V 25 H 238 V 36 H 260 V 80 H 224 V 65 H 246 V 51 H 224 V 10 Z" fill="url(#violetIndigoGrad)" />

      <!-- I (Violet to Indigo) -->
      <path d="M 266 10 H 278 V 80 H 266 V 10 Z" fill="url(#violetIndigoGrad)" />

      <!-- G (Violet to Indigo) -->
      <path d="M 284 10 H 320 V 25 H 298 V 65 H 320 V 48 H 308 V 36 H 332 V 80 H 284 V 10 Z" fill="url(#violetIndigoGrad)" />

      <!-- H (Violet to Indigo) -->
      <path d="M 338 10 H 350 V 39 H 368 V 10 H 380 V 80 H 368 V 51 H 350 V 80 H 338 V 10 Z" fill="url(#violetIndigoGrad)" />

      <!-- T (Violet to Indigo) -->
      <path d="M 386 10 H 428 V 22 H 413 V 80 H 401 V 22 H 386 V 10 Z" fill="url(#violetIndigoGrad)" />
    </g>

    <!-- Underline Trace with Node Terminal -->
    <g transform="translate(10, 94)">
      <!-- Gradient Line -->
      <line x1="0" y1="0" x2="390" y2="0" stroke="url(#violetLineGrad)" stroke-width="3" stroke-linecap="round" />

      <!-- Connecting segment -->
      <line x1="390" y1="0" x2="402" y2="0" stroke="#6366F1" stroke-width="2.5" />

      <!-- Solid Node Circle -->
      <circle cx="402" cy="0" r="4.5" fill="#6366F1" />

      <!-- Interconnecting Segment -->
      <line x1="402" y1="0" x2="415" y2="0" stroke="#6366F1" stroke-width="2.5" />

      <!-- Terminal Ring Node -->
      <circle cx="419" cy="0" r="6" fill="#0F172A" stroke="#6366F1" stroke-width="3" />
    </g>

    <!-- Tagline -->
    <text
      x="220"
      y="126"
      fill="#C084FC"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="12"
      font-weight="700"
      letter-spacing="3.5"
      text-anchor="middle"
    >
      FORENSICS. INTELLIGENCE. IMPACT.
    </text>
  </g>
</svg>
