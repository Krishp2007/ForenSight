server {
    listen 80;
    listen 10000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolver for dynamic DNS lookup (Docker DNS 127.0.0.11 + Public DNS)
    resolver 127.0.0.11 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    # Proxy all /api/* requests to the internal FastAPI backend running on port 8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
    }

    # Proxy interactive FastAPI documentation (/docs, /redoc, /openapi.json)
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # SPA fallback — every non-asset route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
