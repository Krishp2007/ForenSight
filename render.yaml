# ── ForenSight AI — Render Infrastructure Blueprint ─────────────────────────────
# Deploy as a single Unified Web Service on Render (React SPA + FastAPI Backend)
# Or as separate microservices.

services:
  # ── 1. Unified Web Service (Frontend SPA + FastAPI Backend + Local RAG Engine)
  - type: web
    name: forensight-app
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: local
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: forensight
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
